[project]
name = "chaoyin-agent"
version = "0.2.0"
description = "潮引智能衣橱商城 - AI 穿搭客服 Agent（FastAPI + LangGraph）"
requires-python = ">=3.10"
dependencies = [
    # Web
    "fastapi==0.115.12",
    "uvicorn==0.34.0",
    "sse-starlette==2.1.3",
    "pydantic==2.10.6",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    # ES 检索
    "elasticsearch==8.17.1",
    # 种子数据写入 MySQL
    "pymysql==1.1.1",
    "cryptography==50.0.1",
    # Embedding API（EMBEDDING_MODE=api 时）
    "openai==1.68.2",
    # Agent / LLM（langchain 0.3 稳定线）
    "langchain-core==0.3.41",
    "langchain-openai==0.3.7",
    "langgraph==0.2.74",
    "langchain==0.3.20",
    "langchain-mcp-adapters==0.1.7",
    # 本地 Reranker（Qwen3-Reranker-0.6B cross-encoder，CPU 推理）
    "torch==2.5.1",
    "transformers==4.51.3",
    "safetensors==0.4.5",
    "modelscope==1.23.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
