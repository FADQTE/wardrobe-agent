server:
  port: 8080

spring:
  application:
    name: chaoyin-mall
  datasource:
    url: jdbc:mysql://localhost:3307/chaoyin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # Docker 初始化 SQL 只会在新数据卷执行；该增量脚本保证旧环境也能安全补表。
      mode: always
      schema-locations: classpath:schema-extension.sql
  ai:
    mcp:
      server:
        name: chaoyin-mall-mcp
        version: 0.1.0
        type: SYNC
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message

chaoyin:
  agent-url: http://localhost:8000
  # Agent 调 Java 业务接口时使用；生产环境必须通过环境变量覆盖。
  internal-api-key: ${CHAOYIN_INTERNAL_API_KEY:chaoyin-dev-internal-key}
  auth:
    token-hours: ${CHAOYIN_AUTH_TOKEN_HOURS:168}
  netty:
    port: 8090

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.chaoyin: info
