services:
  mysql:
    image: mysql:8.0
    container_name: wardrobe-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chaoyin
      TZ: Asia/Shanghai
    ports:
      # 本机 3306 已被本地 MySQL 占用，容器映射到 16543
      - "16543:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: wardrobe-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "16544:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60

  # 可选：本地 LLM（qwen2.5 等），默认不启动，需要时: docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    container_name: wardrobe-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  mysql-data:
  es-data:
  ollama-data:
